<p>register-form works!</p>
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="name">Nombre</label>
    <input id="name" type="text" formControlName="name" class="form-control" />
    <div *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched" class="error">
      El nombre es obligatorio.
    </div>
  </div>

  <div class="form-group">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" formControlName="email" class="form-control" />
    <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error">
      Ingresa un correo válido.
    </div>
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" class="form-control" />
    <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error">
      La contraseña es obligatoria (mínimo 6 caracteres).
    </div>
  </div>

  <div class="form-group">
    <label for="confirmPassword">Confirmar contraseña</label>
    <input id="confirmPassword" type="password" formControlName="confirmPassword" class="form-control" />
    <div *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched" class="error">
      Las contraseñas deben coincidir.
    </div>
  </div>

  <button type="submit" [disabled]="registerForm.invalid">Registrarse</button>
</form>
