<div class="modal-overlay" *ngIf="mostrar" (click)="onCerrar()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-icon">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </div>
      <div>
        <h3 class="modal-title">Nuevo Servicio</h3>
        <p class="modal-subtitle">Registra un servicio que se podrá asignar a las citas</p>
      </div>
      <button class="modal-close" (click)="onCerrar()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <p class="section-label">Datos del servicio</p>
      <div class="form-grid">
        <div class="form-group form-group--full">
          <label>Nombre <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.nombre" maxlength="120" placeholder="Ej: Limpieza dental" />
        </div>
        <div class="form-group">
          <label>Precio (COP) <span class="req">*</span></label>
          <input type="number" [(ngModel)]="form.precio" min="0" step="1000" placeholder="Ej: 80000" />
        </div>
        <div class="form-group">
          <label>Duración (minutos) <span class="req">*</span></label>
          <input type="number" [(ngModel)]="form.duracion_minutos" min="1" step="5" placeholder="Ej: 45" />
          <span class="field-hint" *ngIf="form.duracion_minutos && form.duracion_minutos >= 60">
            = {{ formatearDuracion(form.duracion_minutos) }}
          </span>
        </div>
        <div class="form-group form-group--full">
          <label>Descripción</label>
          <textarea [(ngModel)]="form.descripcion" rows="3" placeholder="Qué incluye el servicio (opcional)"></textarea>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <p class="error-msg" *ngIf="errorLocal || errorMsg">{{ errorLocal || errorMsg }}</p>
      <button class="btn-cancel" (click)="onCerrar()" [disabled]="guardando">Cancelar</button>
      <button class="btn-save" (click)="onGuardar()" [disabled]="guardando">
        <svg *ngIf="!guardando" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="spinner" *ngIf="guardando"></span>
        {{ guardando ? 'Guardando...' : 'Registrar servicio' }}
      </button>
    </div>

  </div>
</div>
