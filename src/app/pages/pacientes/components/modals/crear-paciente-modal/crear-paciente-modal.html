<div class="modal-overlay" *ngIf="mostrar" (click)="onCerrar()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-icon">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <div>
        <h3 class="modal-title">Nuevo Paciente</h3>
        <p class="modal-subtitle">Completa los datos del paciente a registrar</p>
      </div>
      <button class="modal-close" (click)="onCerrar()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Sección: Datos personales -->
      <p class="section-label">Datos personales</p>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombres <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.nombres" placeholder="Ej: Juan Carlos" />
        </div>
        <div class="form-group">
          <label>Apellidos <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.apellidos" placeholder="Ej: Pérez Gómez" />
        </div>
        <div class="form-group">
          <label>Documento <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.documento" placeholder="Número de identificación" />
        </div>
        <div class="form-group">
          <label>Fecha de Nacimiento <span class="req">*</span></label>
          <input type="date" [(ngModel)]="form.fecha_nacimiento" />
        </div>
        <div class="form-group">
          <label>Género <span class="req">*</span></label>
          <select [(ngModel)]="form.genero">
            <option value="" disabled>Seleccionar...</option>
            <option value="MASCULINO">Masculino</option>
            <option value="FEMENINO">Femenino</option>
            <option value="OTRO">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ciudad <span class="req">*</span></label>
          <select [(ngModel)]="form.id_ciudad">
            <option [ngValue]="null" disabled>Seleccionar...</option>
            <option *ngFor="let c of ciudades" [ngValue]="c.id">
              {{ c.nombre }} — {{ c.departamento }}
            </option>
          </select>
        </div>
      </div>

      <!-- Sección: Contacto -->
      <p class="section-label">Contacto</p>
      <div class="form-grid">
        <div class="form-group">
          <label>Teléfono <span class="req">*</span></label>
          <input type="tel" [(ngModel)]="form.telefono" placeholder="Ej: 3001234567" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="form.email" placeholder="correo@ejemplo.com" />
        </div>
        <div class="form-group form-group--full">
          <label>Dirección</label>
          <input type="text" [(ngModel)]="form.direccion" placeholder="Calle / Carrera / Avenida..." />
        </div>
      </div>

      <!-- Sección: Clínica -->
      <p class="section-label">Información clínica</p>
      <div class="form-grid">
        <div class="form-group form-group--full">
          <label>Alergias</label>
          <textarea [(ngModel)]="form.alergias" rows="2" placeholder="Describa las alergias conocidas..."></textarea>
        </div>
        <div class="form-group form-group--full">
          <label>Observaciones</label>
          <textarea [(ngModel)]="form.observaciones" rows="2" placeholder="Notas adicionales..."></textarea>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <p class="error-msg" *ngIf="errorLocal || errorMsg">{{ errorLocal || errorMsg }}</p>
      <button class="btn-cancel" (click)="onCerrar()" [disabled]="guardando">Cancelar</button>
      <button class="btn-save" (click)="onGuardar()" [disabled]="guardando">
        <svg *ngIf="!guardando" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="spinner" *ngIf="guardando"></span>
        {{ guardando ? 'Guardando...' : 'Registrar paciente' }}
      </button>
    </div>

  </div>
</div>
