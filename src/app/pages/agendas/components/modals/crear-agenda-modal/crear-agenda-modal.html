<div class="modal-overlay" *ngIf="mostrar" (click)="onCerrar()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-icon">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" />
        </svg>
      </div>
      <div>
        <h3 class="modal-title">Nuevo Horario</h3>
        <p class="modal-subtitle">Abre una franja de disponibilidad para un odontólogo</p>
      </div>
      <button class="modal-close" (click)="onCerrar()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group form-group--full">
          <label>Odontólogo <span class="req">*</span></label>
          <select [(ngModel)]="form.id_odontologo">
            <option [ngValue]="0" disabled>Seleccionar...</option>
            <option *ngFor="let o of odontologos" [ngValue]="o.id_odontologo">{{ o.nombres }} {{ o.apellidos }}</option>
          </select>
        </div>
        <div class="form-group form-group--full">
          <label>Fecha <span class="req">*</span></label>
          <input type="date" [(ngModel)]="form.fecha" />
        </div>
        <div class="form-group">
          <label>Hora de inicio <span class="req">*</span></label>
          <input type="time" [(ngModel)]="form.hora_inicio" />
        </div>
        <div class="form-group">
          <label>Hora de fin <span class="req">*</span></label>
          <input type="time" [(ngModel)]="form.hora_fin" />
        </div>
        <div class="form-group form-group--full">
          <label>Observación</label>
          <input type="text" [(ngModel)]="form.observacion" placeholder="Ej: Turno de mañana" />
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <p class="error-msg" *ngIf="errorLocal || errorMsg">{{ errorLocal || errorMsg }}</p>
      <button class="btn-cancel" (click)="onCerrar()" [disabled]="guardando">Cancelar</button>
      <button class="btn-save" (click)="onGuardar()" [disabled]="guardando">
        <svg *ngIf="!guardando" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="spinner" *ngIf="guardando"></span>
        {{ guardando ? 'Guardando...' : 'Crear horario' }}
      </button>
    </div>

  </div>
</div>
