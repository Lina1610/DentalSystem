<div class="modal-overlay" *ngIf="mostrar" (click)="onCerrar()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-icon">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <div>
        <h3 class="modal-title">Nuevo Odontólogo</h3>
        <p class="modal-subtitle">Completa los datos del profesional a registrar</p>
      </div>
      <button class="modal-close" (click)="onCerrar()">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">

      <!-- Sección: Datos personales -->
      <p class="section-label">Datos personales</p>
      <div class="form-grid">
        <div class="form-group">
          <label>Nombres <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.nombres" placeholder="Ej: Juan Carlos" />
        </div>
        <div class="form-group">
          <label>Apellidos <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.apellidos" placeholder="Ej: Pérez Gómez" />
        </div>
        <div class="form-group">
          <label>Documento <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.documento" placeholder="Número de identificación" />
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" [(ngModel)]="form.telefono" placeholder="Ej: 3001234567" />
        </div>
        <div class="form-group form-group--full">
          <label>Email <span class="req">*</span></label>
          <input type="email" [(ngModel)]="form.email" placeholder="correo@ejemplo.com" />
        </div>
      </div>

      <!-- Sección: Acceso al sistema -->
      <p class="section-label">Acceso al sistema</p>
      <div class="form-grid">
        <div class="form-group">
          <label>Usuario <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.username" placeholder="Nombre de usuario" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Contraseña <span class="req">*</span></label>
          <input type="password" [(ngModel)]="form.password_hash" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
        </div>
      </div>

      <!-- Sección: Datos profesionales -->
      <p class="section-label">Datos profesionales</p>
      <div class="form-grid">
        <div class="form-group">
          <label>Tarjeta profesional <span class="req">*</span></label>
          <input type="text" [(ngModel)]="form.tarjeta_profesional" placeholder="Ej: TP-12345" />
        </div>
        <div class="form-group">
          <label>Años de experiencia</label>
          <input type="number" [(ngModel)]="form.experiencia_anios" min="0" max="60" placeholder="0" />
        </div>
        <div class="form-group">
          <label>Especialidad <span class="req">*</span></label>
          <select [(ngModel)]="form.id_especialidad">
            <option [ngValue]="0" disabled>Seleccionar...</option>
            <option *ngFor="let e of especialidades" [ngValue]="e.id">{{ e.nombre }}</option>
          </select>
        </div>
        <div class="form-group">
          <label>Consultorio <span class="req">*</span></label>
          <select [(ngModel)]="form.id_consultorio">
            <option [ngValue]="0" disabled>Seleccionar...</option>
            <option *ngFor="let c of consultorios" [ngValue]="c.id">{{ c.nombre }}</option>
          </select>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <p class="error-msg" *ngIf="errorLocal || errorMsg">{{ errorLocal || errorMsg }}</p>
      <button class="btn-cancel" (click)="onCerrar()" [disabled]="guardando">Cancelar</button>
      <button class="btn-save" (click)="onGuardar()" [disabled]="guardando">
        <svg *ngIf="!guardando" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span class="spinner" *ngIf="guardando"></span>
        {{ guardando ? 'Guardando...' : 'Registrar odontólogo' }}
      </button>
    </div>

  </div>
</div>
